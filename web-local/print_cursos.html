<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cursos impartidos — Listado imprimible</title>
  <link rel="stylesheet" href="assets/css/cursos.css" />
  <style>
    body{ padding:32px; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .docWrap{ max-width:1100px; margin:0 auto; }

    .docHeader{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:28px;
      border-bottom:2px solid #111;
      padding-bottom:14px;
    }

    .docTitle{
      font-size:22px;
      font-weight:900;
      letter-spacing:.5px;
    }

    .docSub{
      font-size:13px;
      opacity:.75;
    }

    .docFooter{
      margin-top:36px;
      padding-top:12px;
      border-top:1px solid #ccc;
      font-size:11px;
      display:flex;
      justify-content:space-between;
      opacity:.8;
    }

    .printControls{
      display:flex;
      gap:14px;
      margin-bottom:26px;
    }

    .btnPrint{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      height:48px;
      padding:0 26px;
      border-radius:16px;
      font-weight:900;
      letter-spacing:.4px;
      background:#ffffff;
      color:#111;
      border:1px solid rgba(0,0,0,.15);
      box-shadow:0 16px 38px rgba(0,0,0,.15);
      cursor:pointer;
      text-decoration:none;
      transition:all .18s ease;
    }

    .btnPrint:hover{
      transform:translateY(-2px);
      box-shadow:0 24px 48px rgba(0,0,0,.22);
    }

        .printPage .nav{ margin:-32px -32px 28px; }
    @media print{
      .nav{ display:none !important; }
      .printControls{ display:none !important; }
      body{ padding:0; }
      .docFooter{ position:fixed; bottom:0; left:0; right:0; }
    }
  </style>
</head>
<body class="printPage">

                <a class="pill" href="certificaciones.html">Certificaciones</a>
            </div>
        </div>
    </div>


<div class="docWrap">

  <div class="printControls">
    <button class="btnPrint" onclick="window.print()">Imprimir listado</button>
  </div>

  <div class="docHeader">
    <div>
      <div class="docTitle">Jacinto Aisa Ibañez</div>
      <div class="docSub">Executive Trainer · Formación In-Company</div>
    </div>
    <div class="docSub">
      Relación completa de cursos impartidos<br>

  <div class="docFooter">

    <div>Documento generado automáticamente</div>
  </div>

</div>

<script src="data.js"></script>
<script src="assets/js/print_courses.js"></script>
