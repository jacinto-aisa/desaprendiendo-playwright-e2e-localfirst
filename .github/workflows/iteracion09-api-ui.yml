# .github/workflows/iteracion09-api-ui.yml
name: Iteracion 09 - API + UI hibrido

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  api-ui:
    name: API + UI hibrido local-first
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_TARGET: local
      API_BASE_URL: http://127.0.0.1:3001
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run test:iteracion09
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-iteracion09
          path: playwright-report/
          retention-days: 30
